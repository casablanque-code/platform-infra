name: Smoke Test (Incus)

# Provisions a real container against a real (throwaway, local-to-the-runner)
# Incus instance, on a GitHub-hosted runner -- no self-hosted infrastructure
# needed. This is NOT a test of provision.yml itself (that requires the
# self-hosted 'incus-host' runner and can't run here), it's a direct test of
# the part most likely to have real bugs: the Terraform module's schema,
# cloud-init's SSH key injection, and the bootstrap scripts actually working
# against a real Incus container. The dispatch plumbing in provision.yml is
# comparatively simple curl calls and lower risk; this covers what isn't.
#
# Commands run via `incus exec` (the Incus API/socket), not network SSH --
# see the "Verify SSH key was actually injected" step for why.
#
# No secrets required -- uses local Terraform state for this run (the s3
# backend block is swapped to local in this throwaway checkout only, see
# the "Use local state backend" step) and a fresh Incus install on the
# runner itself. Safe to run on PRs from forks.

on:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'providers/incus/**'
      - 'bootstrap/base.sh'
      - 'bootstrap/docker.sh'
      - '.github/workflows/smoke-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'templates/**'
      - 'providers/incus/**'
      - 'bootstrap/base.sh'
      - 'bootstrap/docker.sh'
      - '.github/workflows/smoke-test.yml'
  workflow_dispatch: {}

jobs:
  smoke-test:
    strategy:
      fail-fast: false
      matrix:
        template: [docker-host, postgres]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest

      - name: Install Incus
        run: |
          if ! apt-cache show incus &>/dev/null; then
            echo "incus not in default apt repos -- adding Zabbly repo"
            sudo mkdir -p /etc/apt/keyrings
            curl -fsSL https://pkgs.zabbly.com/key.asc | sudo gpg --dearmor -o /etc/apt/keyrings/zabbly.gpg
            . /etc/os-release
            printf 'Enabled: yes\nTypes: deb\nURIs: https://pkgs.zabbly.com/incus/stable\nSuites: %s\nComponents: main\nArchitectures: %s\nSigned-By: /etc/apt/keyrings/zabbly.gpg\n' \
              "$VERSION_CODENAME" "$(dpkg --print-architecture)" \
              | sudo tee /etc/apt/sources.list.d/zabbly-incus-stable.sources > /dev/null
            sudo apt-get update -qq
          fi
          sudo apt-get install -y -q incus incus-client
          incus --version

      - name: Initialize Incus
        run: |
          sudo incus admin init --minimal
          sudo incus config set core.https_address ":8443"
          TOKEN=$(sudo incus config trust add smoke-test --quiet)
          echo "INCUS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          # Runner user needs incus-admin group membership to use the CLI
          # without sudo for the rest of the job
          sudo usermod -aG incus-admin "$USER"

      - name: Generate tfvars
        working-directory: templates/${{ matrix.template }}/tofu
        run: |
          jq --arg env_id "smoketest-${{ github.run_id }}-${{ matrix.template }}" \
             --arg addr "https://127.0.0.1:8443" \
             --arg token "$INCUS_TOKEN" \
            '.runtime.tfvars + {
               environment_id:    $env_id,
               environment_name:  $env_id,
               incus_remote_addr: $addr,
               incus_token:       $token
             }' \
            "../../../providers/incus/provider.json" \
            > terraform.tfvars.json
          jq 'del(.incus_token)' terraform.tfvars.json

      - name: Use local state backend for this test run
        working-directory: templates/${{ matrix.template }}/tofu
        run: |
          # main.tf declares `backend "s3" {}` for the real R2-backed workflow.
          # `tofu init -backend=false` does NOT reliably suppress a declared
          # remote backend across separate init+apply steps -- this is a
          # known, currently-open OpenTofu limitation (opentofu/opentofu#3673):
          # init caches which backend it was actually configured against, and
          # a mismatch against the backend block still declared in code makes
          # apply demand reinitialization even though nothing "changed".
          # Swapping the block to local state, only in this throwaway CI
          # checkout, sidesteps the whole issue cleanly.
          sed -i 's/backend "s3" {}/backend "local" {}/' main.tf

      - name: tofu init
        working-directory: templates/${{ matrix.template }}/tofu
        run: sg incus-admin -c "tofu init -reconfigure -input=false"

      - name: tofu apply
        working-directory: templates/${{ matrix.template }}/tofu
        run: sg incus-admin -c "tofu apply -auto-approve"

      - name: Capture outputs
        id: outputs
        working-directory: templates/${{ matrix.template }}/tofu
        run: |
          # incus_instance can finish "creating" before it's actually gotten a
          # DHCP lease -- public_ip can read back empty right after apply.
          # (wait_for_network would be the obvious fix, but it isn't present
          # on the current provider version despite older docs/issues
          # referencing it -- so this retry loop is the actual mechanism,
          # not a backup for one.) Retry a few times before giving up.
          #
          # public_ip is still verified here even though the rest of this
          # job talks to the container via `incus exec`, not SSH -- a
          # working public_ip is a real requirement of the Terraform module
          # regardless (it's what production SSH access depends on), so
          # this check stays meaningful on its own.
          PUBLIC_IP=""
          for i in $(seq 1 6); do
            sg incus-admin -c "tofu output -json" > outputs.json
            PUBLIC_IP=$(jq -r '.public_ip.value // empty' outputs.json)
            [ -n "$PUBLIC_IP" ] && break
            echo "public_ip not yet available (attempt $i/6), refreshing and retrying in 5s..."
            sleep 5
            sg incus-admin -c "tofu apply -auto-approve -refresh-only" > /dev/null
          done

          if [ -z "$PUBLIC_IP" ]; then
            echo "::error::No public_ip in tofu output after retries -- module didn't produce an IP"
            exit 1
          fi

          INSTANCE_NAME=$(jq -r '.instance_name.value' outputs.json)
          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"
          echo "instance_name=$INSTANCE_NAME" >> "$GITHUB_OUTPUT"

      # `incus exec` talks to the container over the Incus API/socket
      # directly, not over the network -- deliberately used for everything
      # below instead of SSH. GitHub-hosted runners have a known network
      # reachability quirk reaching containers on Incus's own bridge (see
      # https://discuss.linuxcontainers.org/t/ssh-into-a-container-in-github-actions/19724)
      # that's specific to GH's Azure-hosted runner sandbox and has no
      # bearing on the real self-hosted-runner production path, where the
      # runner sits on the same host or LAN as Incus. This still fully
      # exercises cloud-init, the bootstrap scripts, and Docker/PostgreSQL
      # against the real image -- it just doesn't route through the one
      # network hop that's a GH-runner-specific artifact.
      - name: Verify SSH key was actually injected via cloud-init
        run: |
          sg incus-admin -c "incus exec ${{ steps.outputs.outputs.instance_name }} -- systemctl is-active ssh" \
            || (echo "::error::sshd is not active -- cloud-init may not have completed"; exit 1)
          sg incus-admin -c "incus exec ${{ steps.outputs.outputs.instance_name }} -- test -s /home/ubuntu/.ssh/authorized_keys" \
            && echo "authorized_keys present and non-empty -- cloud-init injected the key correctly" \
            || (echo "::error::authorized_keys missing or empty -- cloud-init SSH key injection failed"; exit 1)

      - name: Run bootstrap (base.sh + docker.sh only)
        run: |
          # checkin.sh and install_cfzt.sh both need real platform config
          # (control plane URL, cfzt credentials) that doesn't exist in this
          # throwaway job -- base.sh and docker.sh are the two scripts that
          # actually exercise infrastructure-level correctness (hardening,
          # Docker install), which is what this test is for.
          for SCRIPT in bootstrap/base.sh bootstrap/docker.sh; do
            echo "─── Running $SCRIPT ───"
            sg incus-admin -c "incus exec ${{ steps.outputs.outputs.instance_name }} -- bash -s" < "$SCRIPT"
            echo "─── $SCRIPT done ───"
          done

      - name: Verify Docker actually works
        run: |
          sg incus-admin -c "incus exec ${{ steps.outputs.outputs.instance_name }} -- docker run --rm hello-world" | grep -q "Hello from Docker" \
            && echo "Docker works" \
            || (echo "::error::Docker did not run hello-world successfully"; exit 1)

      - name: Verify PostgreSQL actually works
        if: matrix.template == 'postgres'
        working-directory: templates/postgres/tofu
        run: |
          DB_PASSWORD=$(sg incus-admin -c "tofu output -raw db_password")
          sg incus-admin -c "incus exec ${{ steps.outputs.outputs.instance_name }} -- env PGPASSWORD=$DB_PASSWORD psql -h localhost -U postgres -d app -c 'SELECT 1;'" \
            && echo "PostgreSQL reachable and query succeeded" \
            || (echo "::error::Could not connect to PostgreSQL with the tofu-output credentials"; exit 1)

      - name: tofu destroy
        if: always()
        working-directory: templates/${{ matrix.template }}/tofu
        run: sg incus-admin -c "tofu destroy -auto-approve" || echo "::warning::destroy failed -- runner VM is ephemeral and will be discarded regardless"
